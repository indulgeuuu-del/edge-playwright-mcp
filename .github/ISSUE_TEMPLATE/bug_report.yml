name: Bug report
description: Report a reproducible problem without sharing private proxy data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste subscription URLs, tokens, node names, cookies, or full private logs.
  - type: input
    id: version
    attributes:
      label: Project version or commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command and redacted output from Test-CodexDualNetwork.ps1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
